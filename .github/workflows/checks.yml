# 【続き619】push するたびに検査を自動で走らせる。
#
# 🔴 **なぜ入れたか**: これまで検査（`npm test`・カードの持ち物検査・未宣言の検査・SQLの
# 再実行検査・CSS・お知らせ）は**人が手で走らせていた**。人が覚えている限り動く検査は、
# 忘れた回に静かに通ってしまう。このリポジトリは**本番に直結**している（main に push すると
# GitHub Pages がそのまま公開する）ので、**壊れたものが公開されるのを止める網**が要る。
#
# ⚠ **これは公開を止める仕組みではない**（GitHub Pages の公開は別に走る）。落ちたら
# **赤い印が付いて知らせる**もの。止めたいなら、将来ブランチ保護を足す。
#
# 走る条件: main への push と、main 向けの pull request。手動でも回せる。
name: 検査

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同じブランチで新しい push が来たら、古い実行は打ち切る（待ち時間と無駄を減らす）。
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ブラウザを使わない検査。数秒で終わるので、重いテストより先に出す
  # （壊れていたら早く分かる）。
  static:
    name: 静的な検査（ブラウザ不要）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 🔴 いちばん最初に見る。これが落ちていると、そのファイルを使う機能が
      #    ブラウザで丸ごと起動しない（続き737 の実害）。
      - name: src/*.js が ES モジュールとして読めるか
        run: node tools/check-syntax.mjs
      - name: 未宣言の名前（import 漏れ）
        run: node tools/check-undeclared.mjs
      - name: エンジンの中でどこにも無い名前を呼んでいないか
        run: node tools/check-engine-names.mjs
      - name: カードの持ち物検査
        run: node tools/check-cards.mjs
      - name: SQL の全文再実行が安全か
        run: node tools/check-sql-rerun.mjs
      - name: CSS（ブレースの平衡・max-height の vh）
        run: node tools/check-css.mjs
      - name: お知らせ（日本語と英語の件数）
        run: node tools/check-changelog.mjs
      - name: エンジンのヘルパーが両側にそろっているか
        run: node tools/check-effect-helpers.mjs
      - name: 効果の「選ぶ権利を持つ席」が入口で立っているか
        run: node tools/check-effect-seat.mjs
      - name: 選ばせる候補が画面の有無で黙って落ちないか
        run: node tools/check-pick-candidates.mjs
      - name: canvas のカード文字（書体待ち・組版は1か所）
        run: node tools/check-canvas-fonts.mjs
      - name: 計器に写らない画像（CSSの背景・先読み）のMBが実寸と合っているか
        run: node tools/check-held-images.mjs
      - name: 共有ステートの欄が hydrateState へ全部渡っているか
        run: node tools/check-hydrate-fields.mjs
      - name: Service Worker のキャッシュ名
        run: node tools/check-sw.mjs
      - name: 音（登録・ファイル・呼び出しの名前）
        run: node tools/check-sounds.mjs
      - name: 小さい版の絵（焼き忘れ・置き去り）
        run: node tools/check-thumbs.mjs
      - name: まぜるの山札（クライアントとサーバーの写し）
        run: node tools/check-mixed-deck.mjs
      - name: パックの札・値段（クライアントとサーバーの写し）
        run: node tools/check-card-packs.mjs
      - name: カードの下線の仕組み（解析・繋がり・印の閉じ忘れ）
        run: node tools/check-card-markup.mjs
      - name: import 漏れ（よその export を import せずに呼んでいないか）
        run: node tools/check-missing-import.mjs
      - name: CPUが割り込みの札を一度も使わないままになっていないか
        run: node tools/check-cpu-interrupts.mjs
      - name: ハンドフェイズの自動スキップが判定できない札を残していないか
        run: node tools/check-hand-skip.mjs
      - name: 効果データの印をエンジンが読んでいるか
        run: node tools/check-action-flags.mjs
      - name: 画面の文言（ja/en の鍵・二重書き・差し込み）
        run: node tools/check-ui-text.mjs
      # 🔴 これ自身が「手元とCIのズレ」を見張る（続き711）。ここが抜けるとまた静かに離れる。
      - name: 手元の検査とCIの検査がズレていないか
        run: node tools/check-ci-steps.mjs

  # カード効果のテストとスモーク。Playwright のブラウザを入れるので時間がかかる。
  browser:
    name: カード効果のテストとスモーク
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: 依存を入れる
        run: npm ci
      # Chromium だけ入れる（このリポジトリのテストは Chromium しか使わない）。
      - name: Chromium を入れる
        run: npx playwright install --with-deps chromium
      # 🔴【続き711】**1回だけやり直す。** ブラウザを使う検査は、アプリの不具合ではない
      #   理由で転ぶことがある（起動の途中でページが読み込み直される＝
      #   Resulting promise was garbage collected / page.goto の時間切れ。続き638・668・
      #   673・693 で何度も踏んだ）。1回で赤にすると**赤を信じなくなる**方が高くつくので、
      #   やり直して通ればそれでよしとする。2回とも落ちたら本物として赤にする。
      - name: カード効果のテスト
        run: npm test || (echo '1回目が転んだのでやり直す' && npm test)
      # 🔴【続き740】ペットのアニメに「体の一部が消えるコマ」が無いか。
      #   ヘッダだけでは壊れているかが分からず、**描いて数える**しかないのでここに置く
      #   （ユーザー報告「ポヨンの体の下半分が消える」の再発防止）。
      - name: ペットのアニメ（体の一部が消えるコマ）
        run: node tools/check-pet-sprites.mjs
      - name: スモーク（2人CPU戦を8ターン回す）
        run: node test/smoke.mjs 2 || (echo '1回目が転んだのでやり直す' && node test/smoke.mjs 2)
